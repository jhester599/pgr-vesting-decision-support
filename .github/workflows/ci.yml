name: CI

on:
  push:
    branches:
      - master
      - codex/**
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-regressions:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install runtime and dev dependencies
        run: pip install -e ".[dev]"

      - name: Run Windows safety regressions
        run: >-
          python -m pytest -o addopts="--tb=short" -q
          tests/integration/repo/test_test_suite_hygiene.py
          tests/integration/repo/test_restructure_phase1.py
          tests/integration/repo/test_workflow_contracts.py
          tests/unit/scripts/test_capital_return_charts.py

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install runtime and dev dependencies
        # pyproject.toml is the only dependency list (review 2026-09-25,
        # section 5, phase 4). The editable install makes `src` and `config`
        # (package pgr_vds) import without sys.path edits (phase 0).
        run: pip install -e ".[dev]"

      - name: Ruff syntax and fatal-lint pass
        run: ruff check .

      - name: Active docs have no broken links
        run: python scripts/checks/check_doc_links.py

      - name: No new sys.path edits outside tests/conftest.py
        run: python scripts/checks/check_sys_path_edits.py

      - name: Every research study folder is registered
        # research/registry.yaml lists every research/studies/<id>_<slug>/
        # folder, and research/README.md is generated from it (review
        # 2026-09-25, section 5, phase 3).
        run: python research/tools/registry.py

      - name: mypy pass on hardened modules (v33.1 expanded to 11 modules)
        run: >
          python -m mypy
          src/database/migration_runner.py
          src/ingestion/provider_registry.py
          src/reporting/run_manifest.py
          src/models/evaluation.py
          src/processing/feature_engineering.py
          src/models/drift_monitor.py
          src/models/conformal.py
          src/reporting/backtest_report.py
          src/models/wfo_engine.py
          config/model.py
          config/tax.py

      - name: mypy on the pgr_vds package and the CLI entry points
        # Review 2026-09-25, section 5, phase 5: the monthly decision and the
        # EDGAR monthly pipeline moved out of mypy-exempt scripts into
        # src/pgr_vds/. --follow-imports=silent reports errors in these files
        # only, not in the older src/ modules they import.
        run: python -m mypy --follow-imports=silent src/pgr_vds cli

      - name: Run unit and integration tests
        # tests/unit/ and tests/integration/. Research tests (tests/research/)
        # run in the `research` job and stored-artifact tests (they read
        # committed CSVs, charts and the committed DB) in the `artifacts` job
        # below (review 2026-09-25, F28 and section 5, phase 4).
        run: python -m pytest -q -m "not artifact and not research"

      - name: Prepare external checkout for offline smokes
        run: |
          SMOKE_DIR="$(mktemp -d)"
          cp -a . "$SMOKE_DIR/repo"
          python -m pip install --no-deps --no-build-isolation -e "$SMOKE_DIR/repo"
          echo "PGR_SMOKE_REPO=$SMOKE_DIR/repo" >> "$GITHUB_ENV"

      - name: Smoke test production entrypoints (network mocked)
        # ci_offline_smoke.py refuses every socket connection and serves a
        # canned, empty EDGAR submissions index, so no smoke run reaches
        # Alpha Vantage, FRED or EDGAR (review 2026-09-25, F26).
        working-directory: ${{ env.PGR_SMOKE_REPO }}
        env:
          PYTHONPATH: ${{ env.PGR_SMOKE_REPO }}
          AV_API_KEY: ""
          FRED_API_KEY: ""
          EDGAR_USER_AGENT: "CI smoke test ci@example.invalid"
        run: |
          python scripts/ci_offline_smoke.py scripts/weekly_fetch.py --dry-run --skip-fred
          python scripts/ci_offline_smoke.py scripts/peer_fetch.py --dry-run
          python scripts/ci_offline_smoke.py cli/edgar_monthly_fetch.py --dry-run
          python scripts/ci_offline_smoke.py cli/monthly_decision.py --as-of 2026-04-02 --dry-run --skip-fred

  research:
    # Tests under tests/research/ (marker `research`, applied by folder in
    # tests/conftest.py) cover the research studies and src/research. They
    # are the slowest tests and never gate a production path, so they run
    # on their own (review 2026-09-25, section 5, phase 4).
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install runtime and dev dependencies
        run: pip install -e ".[dev]"

      - name: Run research tests
        run: python -m pytest -q -m "research and not artifact"

  artifacts:
    # Tests marked `artifact` check committed data (results/, artifacts/,
    # data/, the committed DB) rather than code. A failure here means the
    # committed outputs changed or went stale, not that the code broke.
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install runtime and dev dependencies
        run: pip install -e ".[dev]"

      - name: Run stored-artifact tests
        run: python -m pytest -q -m artifact
