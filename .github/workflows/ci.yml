name: CI

on:
  push:
    branches:
      - master
      - codex/**
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install runtime and dev dependencies
        run: |
          pip install -r requirements-dev.txt -c constraints-dev.txt
          # Installs `src` and `config` (package pgr_vds) so they import
          # without sys.path edits (review 2026-09-25, section 5, phase 0).
          pip install --no-deps -e .

      - name: Ruff syntax and fatal-lint pass
        run: ruff check .

      - name: Active docs have no broken links
        run: python scripts/checks/check_doc_links.py

      - name: No new sys.path edits outside tests/conftest.py
        run: python scripts/checks/check_sys_path_edits.py

      - name: Every research study folder is registered
        # research/registry.yaml lists every research/studies/<id>_<slug>/
        # folder, and research/README.md is generated from it (review
        # 2026-09-25, section 5, phase 3).
        run: python research/tools/registry.py

      - name: mypy pass on hardened modules (v33.1 expanded to 11 modules)
        run: >
          python -m mypy
          src/database/migration_runner.py
          src/ingestion/provider_registry.py
          src/reporting/run_manifest.py
          src/models/evaluation.py
          src/processing/feature_engineering.py
          src/models/drift_monitor.py
          src/models/conformal.py
          src/reporting/backtest_report.py
          src/models/wfo_engine.py
          config/model.py
          config/tax.py

      - name: Run unit and integration tests
        # Stored-artifact tests (they read committed CSVs, charts and the
        # committed DB) run in the `artifacts` job below (review 2026-09-25,
        # F28, step 9).
        run: python -m pytest -q -m "not artifact"

      - name: Smoke test production entrypoints (network mocked)
        # ci_offline_smoke.py refuses every socket connection and serves a
        # canned, empty EDGAR submissions index, so no smoke run reaches
        # Alpha Vantage, FRED or EDGAR (review 2026-09-25, F26).
        env:
          AV_API_KEY: ""
          FRED_API_KEY: ""
          EDGAR_USER_AGENT: "CI smoke test ci@example.invalid"
        run: |
          python scripts/ci_offline_smoke.py scripts/weekly_fetch.py --dry-run --skip-fred
          python scripts/ci_offline_smoke.py scripts/peer_fetch.py --dry-run
          python scripts/ci_offline_smoke.py scripts/edgar_8k_fetcher.py --dry-run
          python scripts/ci_offline_smoke.py scripts/monthly_decision.py --as-of 2026-04-02 --dry-run --skip-fred

  artifacts:
    # Tests marked `artifact` check committed data (results/, artifacts/,
    # data/, the committed DB) rather than code. A failure here means the
    # committed outputs changed or went stale, not that the code broke.
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install runtime and dev dependencies
        run: |
          pip install -r requirements-dev.txt -c constraints-dev.txt
          pip install --no-deps -e .

      - name: Run stored-artifact tests
        run: python -m pytest -q -m artifact
