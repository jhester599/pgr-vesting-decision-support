name: Weekly Data Accumulation

on:
  schedule:
    - cron: '0 22 * * 5'   # Friday: prices, PGR dividends, EDGAR, FRED, targets
    # Wednesday: budget-aware dividend refresh for PGR and the ETF benchmarks
    # (review F08). Each ticker is re-fetched once its last fetch is ~4 weeks
    # old (weekly for monthly payers), so ETFs refresh about monthly.
    - cron: '0 16 * * 3'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (log actions, skip HTTP calls)'
        required: false
        default: 'false'
      dividend_refresh:
        description: 'Run the budget-aware dividend refresh instead of the price run'
        required: false
        default: 'false'

concurrency:
  group: weekly-data-accumulation
  cancel-in-progress: false

jobs:
  fetch:
    name: Fetch weekly market data
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weekly fetch
        env:
          AV_API_KEY: ${{ secrets.AV_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          DRY_FLAG=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_FLAG="--dry-run"
          fi
          MODE_FLAG=""
          if [ "${{ github.event.schedule }}" = "0 16 * * 3" ] || [ "${{ github.event.inputs.dividend_refresh }}" = "true" ]; then
            MODE_FLAG="--dividend-refresh"
          fi
          python scripts/weekly_fetch.py $MODE_FLAG $DRY_FLAG

      - name: Verify DB postconditions and write summary
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true') }}
        run: |
          python - <<'PY'
          import config
          from src.database import db_client

          conn = db_client.get_connection(config.DB_PATH)
          snapshot = db_client.get_operational_snapshot(conn)
          latest_prices = snapshot["latest_dates"]["daily_prices.date"]
          latest_targets = snapshot["latest_dates"]["monthly_relative_returns.date"]
          if snapshot["row_counts"]["daily_prices"] == 0:
              raise SystemExit("daily_prices is empty after weekly fetch.")
          if latest_prices is None:
              raise SystemExit("daily_prices latest date is missing after weekly fetch.")
          required_ta_tickers = ["PGR", "VWO"]
          missing_ta = []
          ta_latest = {}
          for ticker in required_ta_tickers:
              row = conn.execute(
                  "SELECT MAX(date) FROM daily_prices WHERE ticker = ?",
                  (ticker,),
              ).fetchone()
              ticker_latest = row[0] if row else None
              ta_latest[ticker] = ticker_latest
              if ticker_latest is None:
                  missing_ta.append(ticker)
          if missing_ta:
              raise SystemExit(
                  "TA shadow replacement features missing required price tickers: "
                  + ", ".join(missing_ta)
              )
          summary = [
              "## Weekly Data Accumulation",
              "",
              f"- Schema version: `{snapshot['schema_version']}`",
              f"- daily_prices rows: `{snapshot['row_counts']['daily_prices']}`",
              f"- daily_dividends rows: `{snapshot['row_counts']['daily_dividends']}`",
              f"- monthly_relative_returns rows: `{snapshot['row_counts']['monthly_relative_returns']}`",
              f"- Latest price date: `{latest_prices}`",
              f"- Latest relative-return date: `{latest_targets}`",
              f"- TA shadow required prices: `{ta_latest}`",
          ]
          with open("workflow_summary.md", "w", encoding="utf-8") as fh:
              fh.write("\n".join(summary) + "\n")
          conn.close()
          PY
          cat workflow_summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit updated database
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true') }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Fold the WAL into the DB file and leave it in DELETE journal
          # mode so the committed file is self-contained (review F29).
          python scripts/finalize_db.py
          git add data/pgr_financials.db
          git diff --staged --quiet || git commit -m "chore: weekly data update $(date -u +%Y-%m-%d) [skip ci]"
          git push

      # Runs after the commit so fresh prices are never held back, but turns
      # the run red when a split is missing from config/splits.py, a ticker
      # has two bars in one ISO week, or (after a dividend refresh) any
      # dividend feed is still stale (review F03/F05/F08/F22).
      - name: Check price, split and dividend integrity
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true') }}
        run: |
          STALE_FLAG=""
          if [ "${{ github.event.schedule }}" = "0 16 * * 3" ] || [ "${{ github.event.inputs.dividend_refresh }}" = "true" ]; then
            STALE_FLAG="--fail-on-stale-dividends"
          fi
          set -o pipefail
          python scripts/check_data_integrity.py $STALE_FLAG | tee -a "$GITHUB_STEP_SUMMARY"
