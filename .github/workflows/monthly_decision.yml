name: Monthly Decision Report

# Fires on the 20th, 21st, and 22nd of each month.
# The script itself is idempotent: it skips if a report for this month
# already exists.  This handles the "first business day on or after the 20th"
# requirement without needing a custom weekend-aware cron expression.
#
# Schedule logic:
#   - 20th fires first (primary target date).
#   - If the 20th is a Saturday, the 21st run produces the report (Sunday → skip,
#     Monday → 22nd fires).
#   - If the 20th is a Sunday, the 21st (Monday) run produces the report.
#   - Once the report exists, the 21st and 22nd runs are no-ops (idempotent).
#
# All runs are at 15:00 UTC = 11 AM ET (after morning data settlement).

on:
  schedule:
    - cron: '0 15 20 * *'   # 20th of each month at 15:00 UTC
    - cron: '0 15 21 * *'   # 21st (fallback if 20th was Saturday)
    - cron: '0 15 22 * *'   # 22nd (fallback if 20th was Sunday)
  workflow_dispatch:
    inputs:
      as_of_date:
        description: 'Override as-of date (YYYY-MM-DD). Defaults to today.'
        required: false
        default: ''
      dry_run:
        description: 'Dry run (generate outputs, skip git commit)'
        type: boolean
        default: false
      skip_fred:
        description: 'Skip FRED data fetch (use cached data)'
        type: boolean
        default: false

concurrency:
  group: monthly-decision-report
  cancel-in-progress: false

jobs:
  monthly-decision:
    name: Generate monthly PGR decision report
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required for git push back to the repo
    env:
      # Every recurring chart, by name. The chart step fails unless each one
      # is rewritten by this run, and only these files are committed.
      # tests/test_capital_return_charts.py checks this list against the
      # CHART_FILES of both chart scripts.
      RESEARCH_CHARTS: >-
        pgr_book_value_per_share.png
        pgr_book_value_per_share_split_adjusted.png
        pgr_share_repurchase_volume.png
        pgr_repurchase_dollar_amount.png
        pgr_repurchase_dollar_amount_capped.png
        pgr_share_price.png
        pgr_share_price_split_adjusted.png
        pgr_price_to_book.png
        pgr_price_to_book_split_adjusted.png
        pgr_repurchase_dividend_annual.png
        pgr_capital_return_pct_marketcap.png
        pgr_cr_vs_capital_return.png

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monthly decision script
        id: decision
        env:
          AV_API_KEY: ${{ secrets.AV_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          AS_OF_FLAG=""
          if [ -n "${{ github.event.inputs.as_of_date }}" ]; then
            AS_OF_FLAG="--as-of ${{ github.event.inputs.as_of_date }}"
          fi

          DRY_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_FLAG="--dry-run"
          fi

          FRED_FLAG=""
          if [ "${{ github.event.inputs.skip_fred }}" = "true" ]; then
            FRED_FLAG="--skip-fred"
          fi

          python scripts/monthly_decision.py $AS_OF_FLAG $DRY_FLAG $FRED_FLAG

      - name: Verify monthly artifacts and write summary
        id: verify
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          python scripts/verify_monthly_outputs.py --summary-path workflow_summary.md
          cat workflow_summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Regenerate research charts
        # Runs after the decision script so the DB is fully up to date.
        # Fails if either script errors or any chart in RESEARCH_CHARTS is
        # not rewritten. The commit and email steps still run (their `if:`
        # does not require this step), but the job ends red and the stale
        # charts are not committed.
        id: charts
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          set -euo pipefail
          started="$(mktemp)"
          python scripts/repurchase_timeseries_charts.py
          python scripts/capital_return_charts.py
          for chart in $RESEARCH_CHARTS; do
            if [ ! "results/research/$chart" -nt "$started" ]; then
              echo "::error::chart not regenerated: results/research/$chart"
              exit 1
            fi
          done

      - name: Commit results
        # Skip commit on dry-run; only commit if there are changes.
        # Runs even if the chart step failed, so the decision and DB are
        # still committed; the charts are staged only when that step passed.
        id: commit
        if: >-
          ${{ !cancelled() && github.event.inputs.dry_run != 'true'
          && steps.decision.outcome == 'success' && steps.verify.outcome == 'success' }}
        env:
          CHARTS_OUTCOME: ${{ steps.charts.outcome }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Fold the WAL into the DB file and leave it in DELETE journal
          # mode so the committed file is self-contained (review F29).
          python scripts/finalize_db.py
          git add results/monthly_decisions/
          git add data/pgr_financials.db
          if [ "$CHARTS_OUTCOME" = "success" ]; then
            for chart in $RESEARCH_CHARTS; do
              git add "results/research/$chart"
            done
          else
            echo "::warning::chart step did not succeed; research charts not committed"
          fi
          # Only commit if there are staged changes
          git diff --staged --quiet || git commit -m \
            "feat: monthly decision report $(date -u +%Y-%m) [skip ci]"
          git push

      - name: Send monthly decision email
        # Send after a successful (non-dry-run) report.  Failure is non-fatal —
        # data collection and DB commit are more critical than the notification.
        # Email logic lives in src/reporting/email_sender.py (testable module).
        if: >-
          ${{ !cancelled() && github.event.inputs.dry_run != 'true'
          && steps.commit.outcome == 'success' }}
        continue-on-error: true
        env:
          SMTP_SERVER:   ${{ secrets.SMTP_SERVER }}
          SMTP_PORT:     ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM:    ${{ secrets.PREDICTION_EMAIL_FROM }}
          EMAIL_TO:      ${{ secrets.PREDICTION_EMAIL_TO }}
        run: |
          python - <<'PYEOF'
          import sys
          from pathlib import Path
          from datetime import datetime, timezone

          sys.path.insert(0, str(Path(__file__).parent.parent))
          from src.reporting.email_sender import send_monthly_email

          try:
              subject = send_monthly_email()
              print(f"[email] Sent: {subject}")
          except FileNotFoundError as exc:
              print(f"[email] Report not found — skipping: {exc}")
              sys.exit(0)
          except ValueError as exc:
              print(f"[email] Missing SMTP config — skipping: {exc}")
              sys.exit(0)
          except RuntimeError as exc:
              print(f"[email] WARNING: Send failed: {exc}")
              sys.exit(1)
          PYEOF
