# Research study registry (review 2026-09-25, section 5, phase 3).
#
# One entry per folder in research/studies/, which is named <id>_<slug>.
# research/README.md is generated from this file:
#     python research/tools/registry.py --write
# CI runs `python research/tools/registry.py`, which fails if a folder is
# not registered, an entry has no folder, or the README is stale.
#
# Fields
#   id           study id (v38, x15, bl01, ...)
#   slug         rest of the folder name
#   date         first commit of the study (YYYY-MM-DD, quoted)
#   question     what the study asked
#   status       promoted | retained | shadow | closed (see research/README.md)
#   promoted_to  the live or shadow setting/module it feeds (null if closed)
#   closeout     closeout note, or the plan/log that records the conclusion
#   notes        optional

