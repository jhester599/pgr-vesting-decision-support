# Package metadata, dependencies and tool configuration (review 2026-09-25,
# section 5, phases 0 and 4). `pip install -e .` makes `src` and `config`
# importable without `sys.path` edits; `scripts/checks/check_sys_path_edits.py`
# stops new ones.
#
# This is the only dependency list: the requirements and constraints files
# are gone (phase 4). Workflows run `pip install -e .`; CI and contributors run
# `pip install -e ".[dev]"`, whose tools are pinned exactly (they were the
# constraints file); the dashboard adds `.[dashboard]`.

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pgr_vds"
version = "0.184.0"
description = "PGR RSU vesting decision support: monthly sell/hold recommendation engine."
readme = "README.md"
# pandas 3 needs Python 3.11+; CI and every workflow run 3.11.
requires-python = ">=3.11"
dependencies = [
    "pandas>=3.0,<4",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "matplotlib>=3.8.0",
    "xgboost>=2.0.0",
    "requests>=2.31.0",
    "lxml>=5.2.0",
    "beautifulsoup4>=4.12.0",
    "python-dotenv>=1.0.0",
    "pyarrow>=15.0.0",
    "scipy>=1.12.0",
    "statsmodels>=0.14.0",
    "skfolio>=0.3.0",
    "PyPortfolioOpt>=1.5.5",
    "mapie>=1.3.0",
]

[project.optional-dependencies]
# Pinned so CI and local runs lint and test with the same tool versions.
dev = [
    "pytest==9.0.2",
    "ruff==0.13.2",
    "mypy==1.18.2",
    "hypothesis==6.135.7",
    # research/tools/registry.py reads research/registry.yaml (CI check).
    "pyyaml==6.0.2",
]
dashboard = [
    "streamlit>=1.35.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*", "config", "config.*"]

# ---------------------------------------------------------------------------
# pytest (was pytest.ini). No -q in addopts: CI adds -q, and -qq hides the
# summary line (review F29).
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"
# unit, integration and research are applied by folder (tests/unit/,
# tests/integration/, tests/research/) in tests/conftest.py.
markers = [
    "unit: tests under tests/unit/ (one module of src/, config/, dashboard/ or scripts/)",
    "integration: tests under tests/integration/ (several layers, the committed DB, repository contracts)",
    "research: tests under tests/research/ (research studies and src/research); runs in its own CI job",
    "slow: marks intentionally expensive tests that can be skipped with --fast",
    "artifact: reads committed data (results/, artifacts/, data/, the committed DB); runs in the separate CI job",
]

# ---------------------------------------------------------------------------
# mypy (was mypy.ini)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "scripts.monthly_decision"
ignore_errors = true

# ---------------------------------------------------------------------------
# ruff (was ruff.toml)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
